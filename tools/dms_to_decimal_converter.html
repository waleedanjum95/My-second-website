<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS to Decimal GPS Coordinates Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }
        .section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #555;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-group div {
            flex: 1;
        }
        label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DMS to Decimal Converter</h2>

    <!-- Latitude Section -->
    <div class="section">
        <h3>Latitude</h3>
        <div class="input-group">
            <div>
                <label>Degrees (°)</label>
                <input type="number" id="latDeg" placeholder="0">
            </div>
            <div>
                <label>Minutes (')</label>
                <input type="number" id="latMin" placeholder="0">
            </div>
            <div>
                <label>Seconds (")</label>
                <input type="number" id="latSec" placeholder="0" step="any">
            </div>
            <div>
                <label>Direction</label>
                <select id="latDir">
                    <option value="N">N</option>
                    <option value="S">S</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Longitude Section -->
    <div class="section">
        <h3>Longitude</h3>
        <div class="input-group">
            <div>
                <label>Degrees (°)</label>
                <input type="number" id="lonDeg" placeholder="0">
            </div>
            <div>
                <label>Minutes (')</label>
                <input type="number" id="lonMin" placeholder="0">
            </div>
            <div>
                <label>Seconds (")</label>
                <input type="number" id="lonSec" placeholder="0" step="any">
            </div>
            <div>
                <label>Direction</label>
                <select id="lonDir">
                    <option value="E">E</option>
                    <option value="W">W</option>
                </select>
            </div>
        </div>
    </div>

    <button onclick="convertDMS()">Convert to Decimal</button>

    <div class="result" id="resultBox" style="display: none;">
        <strong>Decimal Coordinates:</strong><br>
        <span id="decimalOutput"></span>
    </div>
</div>

<script>
    function convertDMS() {
        // Get Latitude values
        let latDeg = parseFloat(document.getElementById('latDeg').value) || 0;
        let latMin = parseFloat(document.getElementById('latMin').value) || 0;
        let latSec = parseFloat(document.getElementById('latSec').value) || 0;
        let latDir = document.getElementById('latDir').value;

        // Get Longitude values
        let lonDeg = parseFloat(document.getElementById('lonDeg').value) || 0;
        let lonMin = parseFloat(document.getElementById('lonMin').value) || 0;
        let lonSec = parseFloat(document.getElementById('lonSec').value) || 0;
        let lonDir = document.getElementById('lonDir').value;

        // Calculate Decimal Latitude
        let latitude = latDeg + (latMin / 60) + (latSec / 3600);
        if (latDir === 'S') {
            latitude = -latitude;
        }

        // Calculate Decimal Longitude
        let longitude = lonDeg + (lonMin / 60) + (lonSec / 3600);
        if (lonDir === 'W') {
            longitude = -longitude;
        }

        // Display Result
        let resultBox = document.getElementById('resultBox');
        let decimalOutput = document.getElementById('decimalOutput');
        
        resultBox.style.display = 'block';
        decimalOutput.innerHTML = `Latitude: <b>${latitude.toFixed(6)}</b><br>Longitude: <b>${longitude.toFixed(6)}</b>`;
    }
</script>

</body>
</html>
