<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced .htaccess Redirect Generator with Loop Detector & Security</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --warning-bg: #fffbeb;
            --warning-border: #f59e0b;
            --warning-text: #b45309;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 750px;
            background: var(--card-bg);
            padding: 30px;
            margin: 30px auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-weight: normal;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        button:active {
            transform: scale(0.98);
        }
        /* Unique Value Addition: Loop & Risk Warning Box */
        .risk-box {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .output-section {
            margin-top: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
        }
        .copy-btn {
            background-color: #10b981;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>.htaccess Redirect & Security Generator</h2>
    
    <div class="form-group">
        <label for="redirectType">Select Redirect Type:</label>
        <select id="redirectType" onchange="toggleInputs()">
            <option value="single">Single Page 301 Redirect</option>
            <option value="domain">Entire Domain to Domain Redirect</option>
            <option value="https">Force HTTPS (SSL Enforcement)</option>
            <option value="www">Force Non-WWW to WWW</option>
        </select>
    </div>

    <div class="form-group" id="oldUrlGroup">
        <label for="oldUrl">Old URL / Slug (e.g., /old-page.html):</label>
        <input type="text" id="oldUrl" placeholder="/old-page.html">
    </div>

    <div class="form-group" id="newUrlGroup">
        <label for="newUrl">New Destination URL (e.g., https://example.com/new-page):</label>
        <input type="text" id="newUrl" placeholder="https://example.com/new-page">
    </div>

    <!-- Unique Value Addition: Security Header Hardening Option -->
    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="securityHeaders" checked>
            <label for="securityHeaders" style="margin-bottom:0; cursor:pointer;">Include Client/Server Security Headers (HSTS & X-Frame Protection)</label>
        </div>
    </div>

    <button onclick="generateCode()">Generate Secure .htaccess Code</button>

    <!-- Unique Value Addition: Live Loop/Syntax Risk Warning Box -->
    <div id="riskWarning" class="risk-box">
        ⚠️ <strong>Warning / Optimization Notice:</strong> <span id="riskText"></span>
    </div>

    <div class="output-section">
        <label for="outputCode">Generated Code Output:</label>
        <textarea id="outputCode" readonly placeholder="Aapka code yahan generate hoga..."></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">Copy Code to Clipboard</button>
    </div>
</div>

<script>
    function toggleInputs() {
        const type = document.getElementById('redirectType').value;
        const oldGroup = document.getElementById('oldUrlGroup');
        const newGroup = document.getElementById('newUrlGroup');

        if (type === 'https' || type === 'www') {
            oldGroup.style.display = 'none';
            newGroup.style.display = 'none';
        } else {
            oldGroup.style.display = 'block';
            newGroup.style.display = 'block';
        }
        document.getElementById('riskWarning').style.display = 'none';
    }

    function generateCode() {
        const type = document.getElementById('redirectType').value;
        const oldUrl = document.getElementById('oldUrl').value.trim();
        const newUrl = document.getElementById('newUrl').value.trim();
        const includeSecurity = document.getElementById('securityHeaders').checked;
        
        let code = `RewriteEngine On\n`;
        let warningMsg = "";
        let hasWarning = false;

        // Unique Feature: Risk & Loop Detection Logic
        if (type === 'single') {
            if (!oldUrl || !newUrl) {
                alert('Barah-e-karam dono fields mukammal bharein!');
                return;
            }
            if (oldUrl === newUrl || oldUrl + '/' === newUrl) {
                hasWarning = true;
                warningMsg = "Old URL aur New URL aik jaise hain! Yeh Infinite Redirect Loop (ERR_TOO_MANY_REDIRECTS) paida kar sakta hai.";
            }
            code += `Redirect 301 ${oldUrl} ${newUrl}\n`;
        } 
        else if (type === 'domain') {
            if (!newUrl) {
                alert('Naya Destination URL lazmi darj karein!');
                return;
            }
            code += `RewriteCond %{HTTP_HOST} ^olddomain\\.com$ [NC]\n`;
            code += `RewriteRule ^(.*)$ ${newUrl}/$1 [R=301,L]\n`;
        } 
        else if (type === 'https') {
            code += `RewriteCond %{HTTPS} off\n`;
            code += `RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]\n`;
        } 
        else if (type === 'www') {
            code += `RewriteCond %{HTTP_HOST} ^example\\.com [NC]\n`;
            code += `RewriteRule ^(.*)$ https://www.example.com/$1 [R=301,L]\n`;
        }

        // Client/Server Security Line & Security Headers Inclusion
        if (includeSecurity) {
            code += `\n# Client & Server Security Hardening Headers\n`;
            code += `<IfModule mod_headers.c>\n`;
            code += `    Header set X-Content-Type-Options "nosniff"\n`;
            code += `    Header set X-Frame-Options "SAMEORIGIN"\n`;
            code += `    Header set X-XSS-Protection "1; mode=block"\n`;
            code += `</IfModule>\n`;
        }

        // Display Warning Box if triggered
        const riskBox = document.getElementById('riskWarning');
        if (hasWarning) {
            document.getElementById('riskText').innerText = warningMsg;
            riskBox.style.display = 'block';
        } else {
            riskBox.style.display = 'none';
        }

        document.getElementById('outputCode').value = code;
    }

    function copyToClipboard() {
        const textarea = document.getElementById('outputCode');
        textarea.select();
        document.execCommand('copy');
        alert('Code successfully clipboard par copy ho gaya hai!');
    }
</script>

</body>
</html>
