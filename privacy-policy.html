<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Privacy Policy - SmartToolsKit</title>

  <meta name="description" content="Read the SmartToolsKit Privacy Policy to understand how our website handles information and protects visitor privacy.">

  <meta name="robots" content="index, follow">

  <meta name="theme-color" content="#0F172A">

  <style>

    :root {
      --navy: #0F172A;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --background: #F8FAFC;
      --white: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      color: var(--navy);
    }

    .logo-shape {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--emerald);
      position: relative;
    }

    .logo-shape::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 4px;
      top: 9px;
      left: 9px;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--emerald-dark);
    }

    .hero {
      background: var(--navy);
      color: white;
      text-align: center;
padding: 85px 0 90px;
overflow: hidden;
}

.hero-content {
  max-width: 800px;
  margin: auto;
  text-align: center;
}

.hero-badge {
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: #A7F3D0;
  padding: 7px 13px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: clamp(38px, 6vw, 62px);
  line-height: 1.08;
  letter-spacing: -1.5px;
  margin-bottom: 20px;
}

.hero h1 span {
  color: #34D399;
}

.hero p {
  max-width: 680px;
  margin: auto;
  color: #CBD5E1;
  font-size: 17px;
}

.search-box {
  max-width: 650px;
  margin: 32px auto 0;
  display: flex;
  background: white;
  padding: 6px;
  border-radius: 12px;
}

.search-box input {
  width: 100%;
  border: none;
  outline: none;
  padding: 14px;
  font-size: 15px;
  color: var(--text);
}

.search-box button {
  border: none;
  background: var(--emerald);
  color: white;
  padding: 0 22px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}

.search-box button:hover {
  background: var(--emerald-dark);
}

/* Sections */

section {
  padding: 70px 0;
}

.section-heading {
  text-align: center;
  margin-bottom: 38px;
}

.section-heading h2 {
  font-size: 32px;
  margin-bottom: 8px;
  color: var(--navy);
}

.section-heading p {
  color: var(--muted);
  max-width: 650px;
  margin: auto;
}

/* Categories */

.category-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
}

.category {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 25px 16px;
  text-align: center;
  transition: 0.2s ease;
}

.category:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: #A7F3D0;
}

.shape {
  width: 42px;
  height: 42px;
  background: var(--soft);
  margin: 0 auto 14px;
  border-radius: 10px;
  position: relative;
}

.shape::before {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border: 3px solid var(--emerald);
  border-radius: 50%;
  top: 9px;
  left: 9px;
}

.category h3 {
  font-size: 15px;
  margin-bottom: 5px;
}

.category p {
  color: var(--muted);
  font-size: 12px;
}

/* Tools */

.tools-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.tool-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: 0.2s ease;
}

.tool-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: #A7F3D0;
}

.tool-shape {
  width: 40px;
  height: 40px;
  border-radius: 9px;
  background: #ECFDF5;
  margin-bottom: 16px;
  position: relative;
}

.tool-shape::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 15px;
  border: 3px solid var(--teal);
  top: 9px;
  left: 9px;
  transform: rotate(45deg);
}

.tool-card h3 {
  font-size: 16px;
  margin-bottom: 7px;
}

.tool-card p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 15px;
}

.tool-link {
  color: var(--emerald-dark);
  font-size: 13px;
  font-weight: 700;
}

/* About section */

.intro {
  background: white;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.intro-content {
  max-width: 850px;
  margin: auto;
}

.intro h2 {
  text-align: center;
  font-size: 31px;
  margin-bottom: 20px;
}

.intro p {
  color: #475569;
  margin-bottom: 16px;
  font-size: 15px;
}

/* CTA */

.cta {
  background: var(--navy);
  color: white;
  text-align: center;
}

.cta h2 {
  font-size: 32px;
  margin-bottom: 12px;
}

.cta p {
  color: #CBD5E1;
  margin-bottom: 24px;
}

.cta a {
  display: inline-block;
  background: var(--emerald);
  padding: 12px 22px;
  border-radius: 9px;
  font-weight: 700;
}

.cta a:hover {
  background: var(--emerald-dark);
}

/* Footer */

footer {
  background: #020617;
  color: #CBD5E1;
  padding: 45px 0 25px;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 40px;
  margin-bottom: 35px;
}

footer h3 {
  color: white;
  margin-bottom: 12px;
  font-size: 16px;
}

footer p,
footer a {
  color: #94A3B8;
  font-size: 13px;
}

footer a:hover {
  color: #34D399;
}

.footer-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.copyright {
  border-top: 1px solid #1E293B;
  padding-top: 20px;
  text-align: center;
  color: #64748B;
  font-size: 12px;
}

/* Mobile */

@media (max-width: 900px) {

  .category-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .tools-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 650px) {

  .nav {
    min-height: 65px;
  }

  nav {
    gap: 10px;
  }

  nav a:not(.nav-button) {
    display: none;
  }

  .hero {
    padding: 65px 0 70px;
  }

  .hero p {
    font-size: 15px;
  }

  .search-box {
    flex-direction: column;
    gap: 6px;
    background: transparent;
  }

  .search-box input {
    border-radius: 8px;
  }

  .search-box button {
    min-height: 46px;
  }

  section {
    padding: 55px 0;
  }

  .category-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .tools-grid {
    grid-template-columns: 1fr;
  }

  .footer-grid {
    grid-template-columns: 1fr;
    gap: 25px;
  }
}

</style>
</head>
